<!DOCTYPE html>
<html lang="ko" data-theme="ivory">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ede1" id="meta-theme-color">
  <title>생리학 2학기 기말 문제은행 (12~18장 확정본)</title>

  <style>
    /* =====================================================
       1. 아이보리 (기본 · 종이책 라이트 테마)
       ===================================================== */
    :root,
    :root[data-theme="ivory"] {
      color-scheme: light;
      --bg: #f4ede1;
      --card: #fcf9f2;
      --subcard: #f6efe2;
      --option: #f7f1e6;
      --option-hover: #ece2cf;
      --line: #d4c6b0;
      --line-soft: #e4dac8;
      --text: #2b241d;
      --muted: #6e6051;
      --title-color: #241d17;
      --question-color: #201913;
      --point-bg: #f4f7f9;
      --chip-active-bg: #f7e4a3;
      --track-bg: #e3d8c6;
      --feedback-bg: #faf3dc;
      --feedback-wrong-bg: #fbedeb;
      --disabled-bg: #e5dccd;
      --disabled-text: #8b7d6c;
      --num-bg: #fcf9f2;
      --num-border: #9f8f7a;
      --num-text: #4f4336;

      --green: #2c684b;
      --green-bg: #dcece2;
      --green-border: #6ba183;
      --green-ink: #193c2b;

      --red: #a83c34;
      --red-strong: #9f362f;
      --red-bg: #fae9e7;
      --red-border: #d26c64;
      --red-ink: #5d1d18;

      --accent: #3d5a73;
      --accent-bg: #e5edf3;
      --accent-border: #8aa5bc;

      --yellow: #f2cf66;
      --yellow-hover: #e7be4a;
      --yellow-border: #b68616;
      --yellow-soft: #594008;
      --yellow-ink: #221b14;

      --sky: #dce7ef;
      --sky-hover: #ccdce8;
      --sky-border: #7a98b0;
      --sky-ink: #1e3344;

      --primary-btn-bg: #3d5a73;
      --primary-btn-hover: #324c63;
      --primary-btn-border: #2e475d;
      --primary-btn-text: #fdfbf7;
    }

    /* =====================================================
       2. 세이지 그린 (눈 보호 연녹색 테마)
       ===================================================== */
    :root[data-theme="sage"] {
      color-scheme: light;
      --bg: #e2ebe2;
      --card: #f2f7f2;
      --subcard: #e7f0e7;
      --option: #e9f2e9;
      --option-hover: #dce8dc;
      --line: #bdd0bd;
      --line-soft: #d2e0d2;
      --text: #1e2b20;
      --muted: #506353;
      --title-color: #18241a;
      --question-color: #162118;
      --point-bg: #eaf2ef;
      --chip-active-bg: #f3e29f;
      --track-bg: #cddccd;
      --feedback-bg: #f6f2dc;
      --feedback-wrong-bg: #f9e9e7;
      --disabled-bg: #d7e3d7;
      --disabled-text: #728574;
      --num-bg: #f2f7f2;
      --num-border: #859e87;
      --num-text: #3d5240;

      --green: #226341;
      --green-bg: #d2e8dc;
      --green-border: #5f997a;
      --green-ink: #133824;

      --red: #a83c34;
      --red-strong: #9f362f;
      --red-bg: #fae9e7;
      --red-border: #d26c64;
      --red-ink: #5d1d18;

      --accent: #2e5c52;
      --accent-bg: #deece8;
      --accent-border: #7ca69c;

      --yellow: #eed06b;
      --yellow-hover: #e3c04d;
      --yellow-border: #a88218;
      --yellow-soft: #4d3906;
      --yellow-ink: #1e1912;

      --sky: #d8e7e1;
      --sky-hover: #c7dcd4;
      --sky-border: #749c8e;
      --sky-ink: #18362c;

      --primary-btn-bg: #2e5c52;
      --primary-btn-hover: #244b42;
      --primary-btn-border: #20423a;
      --primary-btn-text: #f5faf7;
    }

    /* =====================================================
       3. E-Ink 웜 그레이 (전자책 저반사 톤)
       ===================================================== */
    :root[data-theme="eink"] {
      color-scheme: light;
      --bg: #e3e1dc;
      --card: #f1efe9;
      --subcard: #e7e5df;
      --option: #e9e7e1;
      --option-hover: #dcd9d1;
      --line: #c4c0b6;
      --line-soft: #d6d2c9;
      --text: #23221f;
      --muted: #5c5952;
      --title-color: #1c1b18;
      --question-color: #1a1916;
      --point-bg: #eaecef;
      --chip-active-bg: #f3e2a1;
      --track-bg: #d1cec6;
      --feedback-bg: #f5f0dc;
      --feedback-wrong-bg: #f7e7e5;
      --disabled-bg: #dad7cf;
      --disabled-text: #7a766e;
      --num-bg: #f1efe9;
      --num-border: #918d84;
      --num-text: #45423c;

      --green: #2b6649;
      --green-bg: #d8e7de;
      --green-border: #689c80;
      --green-ink: #173a29;

      --red: #a33b33;
      --red-strong: #99342d;
      --red-bg: #f6e6e4;
      --red-border: #cc6a62;
      --red-ink: #591c17;

      --accent: #3d5266;
      --accent-bg: #dfe6ed;
      --accent-border: #8599ad;

      --yellow: #efd06e;
      --yellow-hover: #e4bf4f;
      --yellow-border: #ad841a;
      --yellow-soft: #523c07;
      --yellow-ink: #1f1c16;

      --sky: #dce3ea;
      --sky-hover: #ced7e1;
      --sky-border: #7d92a6;
      --sky-ink: #1d2d3d;

      --primary-btn-bg: #3d5266;
      --primary-btn-hover: #304254;
      --primary-btn-border: #283847;
      --primary-btn-text: #f7f6f2;
    }

    /* =====================================================
       4. 웜 차콜 다크 (야간 공부용 다크 테마)
       ===================================================== */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1b19;
      --card: #262421;
      --subcard: #2f2c28;
      --option: #2d2a26;
      --option-hover: #38342f;
      --line: #46413a;
      --line-soft: #38342e;
      --text: #e6e0d5;
      --muted: #a89f91;
      --title-color: #f0ebe1;
      --question-color: #efe9de;
      --point-bg: #252c33;
      --chip-active-bg: #4a3c16;
      --track-bg: #36322c;
      --feedback-bg: #2f291c;
      --feedback-wrong-bg: #352221;
      --disabled-bg: #312e29;
      --disabled-text: #7d7569;
      --num-bg: #22201d;
      --num-border: #635c52;
      --num-text: #cfc7b8;

      --green: #6bc497;
      --green-bg: #20382c;
      --green-border: #468565;
      --green-ink: #bce8d1;

      --red: #e57c73;
      --red-strong: #b84239;
      --red-bg: #3b2321;
      --red-border: #9e4740;
      --red-ink: #f5c2bd;

      --accent: #82b1d6;
      --accent-bg: #24323f;
      --accent-border: #4a6b87;

      --yellow: #e5be53;
      --yellow-hover: #d6ae42;
      --yellow-border: #b89025;
      --yellow-soft: #f5d67b;
      --yellow-ink: #1c170f;

      --sky: #253442;
      --sky-hover: #2f4254;
      --sky-border: #4a6a87;
      --sky-ink: #cfe2f2;

      --primary-btn-bg: #3b5973;
      --primary-btn-hover: #476a88;
      --primary-btn-border: #557b9c;
      --primary-btn-text: #f5f2eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Pretendard", -apple-system, BlinkMacSystemFont,
        "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.55;
      overflow-wrap: anywhere;
      transition: background-color .18s ease, color .18s ease;
    }

    button {
      font: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 10px 14px max(14px, env(safe-area-inset-bottom));
    }

    .top-panel {
      display: block;
    }

    header {
      margin-bottom: 7px;
    }

    .title-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    h1 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--title-color);
      letter-spacing: -.03em;
      line-height: 1.25;
    }

    #mode-badge {
      padding: 2px 9px;
      border: 1.5px solid var(--accent-border);
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--sky-ink);
      font-size: .75rem;
      font-weight: 800;
      line-height: 1.3;
    }

    #mode-badge.is-exam {
      border-color: var(--yellow-border);
      background: var(--yellow);
      color: var(--yellow-ink);
    }

    /* 원클릭 화면 테마 전환 버튼 */
    .theme-btn {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      font-size: .76rem;
      font-weight: 800;
      line-height: 1.3;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
      transition: transform .1s ease, background-color .15s ease, border-color .15s ease;
    }

    .theme-btn:active {
      transform: scale(.97);
    }

    .description {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
    }

    /* 상단 주요 버튼 바 (컴팩트 높이) */
    .control-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 7px;
    }

    .big-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-height: 40px;
      padding: 5px 10px;
      border-radius: 10px;
      text-align: center;
      word-break: keep-all;
      cursor: pointer;
      transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease;
    }

    .big-btn:active {
      transform: scale(.985);
    }

    .big-btn-main {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .92rem;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.2;
    }

    .big-btn-sub {
      font-size: .72rem;
      font-weight: 700;
      opacity: .84;
      line-height: 1.15;
    }

    .big-btn.is-shuffle {
      border: 1.5px solid var(--sky-border);
      background: var(--sky);
      color: var(--sky-ink);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .06);
    }

    .big-btn.is-exam-start {
      border: 1.5px solid var(--yellow-border);
      background: var(--yellow);
      color: var(--yellow-ink);
      box-shadow: 0 2px 8px rgba(182, 134, 22, .14);
    }

    .big-btn.is-return-all {
      border: 1.5px solid var(--green-border);
      background: var(--green-bg);
      color: var(--green-ink);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
    }

    #toast {
      margin: 0 0 7px;
      padding: 6px 10px;
      border: 1.5px solid var(--accent-border);
      border-radius: 9px;
      background: var(--accent-bg);
      color: var(--sky-ink);
      font-size: .8rem;
      font-weight: 700;
    }

    /* 실시간 점수판 (컴팩트 높이) */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 7px;
    }

    .score-box {
      padding: 4px 5px;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
    }

    .score-box.is-point {
      border-color: var(--accent-border);
      background: var(--point-bg);
    }

    .score-label {
      display: block;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .score-value {
      display: block;
      margin-top: 1px;
      font-size: clamp(1.02rem, 2.8vw, 1.18rem);
      font-weight: 850;
      line-height: 1.15;
      letter-spacing: -.02em;
      white-space: nowrap;
      color: var(--text);
    }

    .score-sub {
      font-size: .75rem;
      font-weight: 700;
      color: var(--muted);
    }

    .score-value.is-accent {
      color: var(--accent);
    }

    .score-value.is-green {
      color: var(--green);
    }

    .score-value.is-red {
      color: var(--red);
    }

    /* 장별 출제 현황 (12~18장, 7개 장) */
    .part-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }

    .part-chip {
      padding: 3px 8px;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      background: var(--subcard);
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
      line-height: 1.25;
      word-break: keep-all;
    }

    .part-chip.is-active {
      border-color: var(--yellow-border);
      background: var(--chip-active-bg);
      color: var(--text);
      font-weight: 800;
    }

    .chip-short {
      display: none;
    }

    .progress-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 2px 12px;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
    }

    .progress-track {
      height: 5px;
      margin-bottom: 8px;
      overflow: hidden;
      border-radius: 10px;
      background: var(--track-bg);
    }

    #progress-fill {
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width .2s ease;
    }

    /* 문제 카드 (불필요한 여백 최소화) */
    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 13px 16px 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
    }

    .card-top {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 7px;
      margin-bottom: 9px;
      border-bottom: 1.5px solid var(--line-soft);
    }

    .card-body {
      min-width: 0;
    }

    #question-meta {
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--subcard);
      color: var(--text);
      font-size: .8rem;
      font-weight: 800;
      white-space: nowrap;
    }

    #source-number {
      color: var(--accent);
      font-size: .86rem;
      font-weight: 800;
      line-height: 1.3;
      text-align: right;
    }

    #question {
      margin: 0 0 11px;
      color: var(--question-color);
      font-size: 1.03rem;
      font-weight: 700;
      line-height: 1.52;
      letter-spacing: -.02em;
      white-space: pre-line;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    #choices {
      display: grid;
      gap: 6px;
    }

    .choice {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-width: 0;
      padding: 9px 12px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: var(--option);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background-color .14s ease, border-color .14s ease, opacity .14s ease;
    }

    .choice-number {
      display: grid;
      place-items: center;
      flex: 0 0 24px;
      min-height: 24px;
      border: 1.5px solid var(--num-border);
      border-radius: 6px;
      background: var(--num-bg);
      color: var(--num-text);
      font-size: .8rem;
      font-weight: 800;
    }

    /* 5지선다 선택지: 볼드체 적용 */
    .choice-text {
      flex: 1 1 auto;
      min-width: 0;
      font-size: .94rem;
      font-weight: 700;
      line-height: 1.38;
      white-space: pre-line;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .choice-badge {
      flex: 0 0 auto;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 850;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* 정답 선지: 형광펜 골드 + 또렷한 검정(짙은 잉크) 글씨 */
    .choice.correct {
      border: 2px solid var(--yellow-border);
      background: var(--yellow);
      color: var(--yellow-ink);
      box-shadow: 0 0 0 2px rgba(182, 134, 22, .20), 0 3px 10px rgba(182, 134, 22, .16);
    }

    .choice.correct .choice-number {
      border-color: var(--yellow-ink);
      background: var(--yellow-ink);
      color: #fbe59b;
    }

    .choice.correct .choice-text {
      font-weight: 800;
      color: var(--yellow-ink);
    }

    .choice.correct .choice-badge {
      background: var(--yellow-ink);
      color: #fbe59b;
    }

    /* 내가 고른 오답 선지 */
    .choice.wrong {
      border: 2px solid var(--red-border);
      background: var(--red-bg);
      color: var(--red-ink);
    }

    .choice.wrong .choice-number {
      border-color: var(--red-border);
      background: var(--red-bg);
      color: var(--red-ink);
    }

    .choice.wrong .choice-badge {
      background: var(--red-strong);
      color: #ffffff;
    }

    .choice:disabled {
      cursor: default;
    }

    .choice:disabled:not(.correct):not(.wrong) {
      opacity: .46;
    }

    /* 완료 결과 요약 */
    #summary-box {
      display: grid;
      gap: 8px;
      margin-top: 6px;
    }

    .final-score-banner {
      padding: 14px 12px;
      border: 1.5px solid var(--accent-border);
      border-radius: 12px;
      background: var(--point-bg);
      text-align: center;
    }

    .final-score-label {
      display: block;
      color: var(--muted);
      font-size: .86rem;
      font-weight: 700;
    }

    .final-score-number {
      display: block;
      margin: 3px 0;
      color: var(--yellow-soft);
      font-size: 1.75rem;
      font-weight: 850;
      letter-spacing: -.03em;
    }

    .final-score-rate {
      color: var(--accent);
      font-size: .88rem;
      font-weight: 700;
    }

    .part-result-list {
      display: grid;
      gap: 6px;
    }

    .part-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      background: var(--subcard);
      font-size: .9rem;
    }

    .part-result-name {
      font-weight: 750;
      color: var(--text);
    }

    .part-result-score {
      font-weight: 800;
      color: var(--accent);
    }

    /* 정답 및 해설 피드백 영역 */
    #feedback {
      margin-top: 11px;
      padding: 12px;
      border: 2px solid var(--yellow-border);
      border-radius: 11px;
      background: var(--feedback-bg);
    }

    #feedback.is-wrong {
      border-color: var(--red-border);
      background: var(--feedback-wrong-bg);
    }

    #result {
      margin: 0 0 8px;
      padding: 7px 11px;
      border-radius: 8px;
      background: var(--yellow);
      color: var(--yellow-ink);
      font-size: .94rem;
      font-weight: 850;
      line-height: 1.3;
      letter-spacing: -.01em;
    }

    #feedback.is-wrong #result {
      background: var(--red-strong);
      color: #ffffff;
    }

    .answer-box {
      padding: 9px 11px;
      border: 1.5px solid var(--yellow-border);
      border-radius: 8px;
      background: var(--card);
    }

    .answer-label {
      display: inline-block;
      margin-bottom: 3px;
      padding: 1px 7px;
      border-radius: 5px;
      background: var(--yellow);
      color: var(--yellow-ink);
      font-size: .74rem;
      font-weight: 850;
      line-height: 1.3;
    }

    #answer-text {
      margin: 0;
      color: var(--yellow-soft);
      font-size: .95rem;
      font-weight: 800;
      line-height: 1.4;
      overflow-wrap: anywhere;

<body>
  <main>
    <div class="top-panel">
      <header>
        <div class="title-line">
          <h1>생리학 2학기 기말 문제은행</h1>

           id="progress-bar">

    <section class="card">

        <span id="question-meta"></span>
        <span id="source-number"></span>

        <h2 id="question">문제를 불러오는 중입니다.</h2>

        <div id="choices" role="group" aria-label="5지선다 선택지"></div>

                 aria-label="정답 및 해설"

    <p class="hint" id="hint">
      숫자 키(1~5)로 보기를 선택하고 Enter 키로 다음 문제로 넘어갈 수 있습니다.

  <!-- 분리된 문제 파일 3개 (60문제 + 60문제 + 56문제 = 총 176문제) -->
  <script src="./q1.js"></script>
  <script src="./q2.js"></script>
  <script src="./q3.js"></script>

  <script>
    const $ = id => document.getElementById(id);

    /* =====================================================
       원클릭 화면 테마 전환 (아이보리 · 세이지 그린 · E-Ink · 다크)
       ===================================================== */
    const THEME_STORAGE_KEY = "physiology-quiz-theme-v1";
    const THEMES = [
      { id: "ivory", label: "📖 아이보리", desc: "따뜻한 종이책 라이트 톤", metaColor: "#f4ede1" },
      { id: "sage", label: "🌿 세이지 그린", desc: "눈 보호 연녹색 톤", metaColor: "#e2ebe2" },
      { id: "eink", label: "📄 E-Ink 그레이", desc: "저반사 전자책 톤", metaColor: "#e3e1dc" },
      { id: "dark", label: "🌙 웜 차콜 다크", desc: "야간 공부용 다크 톤", metaColor: "#1c1b19" }
    ];

    let currentThemeIndex = 0;

    function applyThemeByIndex(index, notify = false) {
      currentThemeIndex = ((index % THEMES.length) + THEMES.length) % THEMES.length;
      const theme = THEMES[currentThemeIndex];
      document.documentElement.setAttribute("data-theme", theme.id);

      const metaTag = $("meta-theme-color");
      if (metaTag) metaTag.setAttribute("content", theme.metaColor);

      const btn = $("theme-btn");
      if (btn) btn.textContent = theme.label;

      try {
        localStorage.setItem(THEME_STORAGE_KEY, theme.id);
      } catch {
        // 저장소 제한 시 무시
      }

      if (notify) {
        showToast(`화면 테마 변경: ${theme.label} (${theme.desc})`);
      }
    }

    function initTheme() {
      let savedId = null;
      try {
        savedId = localStorage.getItem(THEME_STORAGE_KEY);
      } catch {
        savedId = null;
      }

      if (savedId) {
        const foundIdx = THEMES.findIndex(t => t.id === savedId);
        if (foundIdx !== -1) {
          applyThemeByIndex(foundIdx, false);
          return;
        }
      }

      // 저장된 설정이 없으면 기기 다크모드 여부를 감지하여 자동 적용
      const prefersDark =
        typeof window.matchMedia === "function" &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      applyThemeByIndex(prefersDark ? 3 : 0, false);
    }

    $("theme-btn").addEventListener("click", () => {
      applyThemeByIndex(currentThemeIndex + 1, true);
    });

    /* =====================================================
       문제 은행 초기화 및 채점 로직
       ===================================================== */
    const EXAM_PER_CHAPTER = 6;
    const EXAM_HISTORY_KEY = "physiology-final-176-exam-history-v1";

    const rawQuestions = (Array.isArray(window.quizQuestionParts) ? window.quizQuestionParts : [])
      .flat()
      .filter(q => q && q.question && Array.isArray(q.choices) && q.choices.length === 5);

    const seenIds = new Set();
    const chapterMap = new Map();

    rawQuestions.forEach((q, idx) => {
      const uid = q.id || `q-auto-${idx + 1}`;
      if (seenIds.has(uid)) return;
      seenIds.add(uid);

      const chKey = String(q.chapter || "etc");
      const label = q.chapterLabel || `${chKey}장`;
      const shortLabel = q.shortLabel || `${chKey}장`;

      if (!chapterMap.has(chKey)) {
        chapterMap.set(chKey, {
          id: `ch-${chKey}`,
          chapter: chKey,
          label,
          shortLabel,
          questions: []
        });
      }

      chapterMap.get(chKey).questions.push({
        ...q,
        id: uid,
        bankId: `ch-${chKey}`,
        bankLabel: label
      });
    });

    const validBanks = [...chapterMap.values()].sort(
      (a, b) => Number(a.chapter) - Number(b.chapter)
    );

    const allUniqueQuestions = validBanks.flatMap(bank => bank.questions);
    const totalPoolCount = allUniqueQuestions.length;
    const examTotalCount = validBanks.reduce(
      (sum, bank) => sum + Math.min(EXAM_PER_CHAPTER, bank.questions.length),
      0
    );

    let currentMode = "all"; // "all" | "exam"
    let sessionQuestions = [];
    let partPlan = {};
    let partStats = {};
    let currentIndex = 0;
    let answeredCount = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let answered = false;
    let isCompleted = false;
    let toastTimer = null;

    function shuffle(array) {
      const copied = [...array];
      for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function loadExamHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(EXAM_HISTORY_KEY));
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveExamHistory(history) {
      try {
        localStorage.setItem(EXAM_HISTORY_KEY, JSON.stringify(history));
      } catch {
        // 저장소 제한 시 무시
      }
    }

    function pickExamQuestionsFromBank(bank, limit, history) {
      const target = Math.min(limit, bank.questions.length);
      const validIds = new Set(bank.questions.map(q => q.id));

      const usedList = Array.isArray(history[bank.id])
        ? [...new Set(history[bank.id])].filter(id => validIds.has(id))
        : [];
      const usedSet = new Set(usedList);

      const unseen = shuffle(bank.questions.filter(q => !usedSet.has(q.id)));
      const seen = shuffle(bank.questions.filter(q => usedSet.has(q.id)));

      let picked = [];

      if (unseen.length >= target) {
        picked = unseen.slice(0, target);
        const updatedUsed = [...usedSet, ...picked.map(q => q.id)];
        history[bank.id] = updatedUsed.length >= bank.questions.length ? [] : updatedUsed;
      } else {
        const needMore = target - unseen.length;
        const extra = seen.slice(0, needMore);
        picked = [...unseen, ...extra];
        history[bank.id] = extra.map(q => q.id);
      }

      return picked;
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.hidden = false;

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.hidden = true;
      }, 2400);
    }

    function resetScrollPositions() {
      $("card-body").scrollTop = 0;
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function updateModeUI() {
      const isExam = currentMode === "exam";
      const badge = $("mode-badge");
      const desc = $("mode-desc");
      const shuffleSub = $("shuffle-btn-sub");
      const examBtn = $("exam-btn");
      const examBtnMain = $("exam-btn-main");
      const examBtnSub = $("exam-btn-sub");

      badge.classList.toggle("is-exam", isExam);

      if (isExam) {
        badge.textContent = `📝 시험 (${examTotalCount}문제)`;
        desc.textContent =
          `12장~18장 각 장별 ${EXAM_PER_CHAPTER}문제씩 총 ${examTotalCount}문제를 중복 없이 출제합니다. (1문제당 1점)`;
        shuffleSub.textContent = `장별 ${EXAM_PER_CHAPTER}문제 새로 뽑기`;

        examBtn.classList.remove("is-exam-start");
        examBtn.classList.add("is-return-all");
        examBtnMain.textContent = "📚 전체 문제로";
        examBtnSub.textContent = `전체 ${totalPoolCount}문제 모드로 전환`;
      } else {
        badge.textContent = `전체 (${totalPoolCount}문제)`;
        desc.textContent =
          `12장~18장 확정본 전체 ${totalPoolCount}문제를 중복 없이 랜덤 5지선다로 풉니다. (1문제당 1점)`;
        shuffleSub.textContent = `전체 ${totalPoolCount}문제 순서 새로 섞기`;

        examBtn.classList.remove("is-return-all");
        examBtn.classList.add("is-exam-start");
        examBtnMain.textContent = `📝 시험시작 (${examTotalCount})`;
        examBtnSub.textContent = `장별 ${EXAM_PER_CHAPTER}문제 · 총 ${examTotalCount}문제`;
      }
    }

    function renderPartChips(activeBankId = null) {
      const container = $("part-chips");
      container.replaceChildren();

      validBanks.forEach(bank => {
        const count = partPlan[bank.id] || 0;
        if (!count) return;

        const chip = document.createElement("span");
        chip.className = "part-chip";
        if (bank.id === activeBankId) {
          chip.classList.add("is-active");
        }

        const longSpan = document.createElement("span");
        longSpan.className = "chip-long";
        longSpan.textContent = `${bank.shortLabel} (${count})`;

        const shortSpan = document.createElement("span");
        shortSpan.className = "chip-short";
        shortSpan.textContent = `${bank.shortLabel} ${count}`;

        chip.append(longSpan, shortSpan);
        container.appendChild(chip);

        if (bank.id === activeBankId) {
          requestAnimationFrame(() => {
            chip.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
          });
        }
      });
    }

    function updateScoreboard() {
      const total = sessionQuestions.length;
      const remaining = Math.max(0, total - answeredCount);
      const percentage = total ? Math.round((answeredCount / total) * 100) : 0;

      $("score-points").textContent = String(correctCount);
      $("score-max").textContent = `/${total}`;
      $("correct-count").textContent = String(correctCount);
      $("wrong-count").textContent = String(wrongCount);
      $("remaining-count").textContent = String(remaining);

      $("progress-text").textContent = `${answeredCount} / ${total}문제 풀이 완료`;
      $("pool-info").textContent =
        currentMode === "exam"
          ? `시험 모드 · 장별 ${EXAM_PER_CHAPTER}문제 (총 ${total}문제)`
          : `전체 문제 · 중복 없이 ${total}문제 출제`;

      $("progress-fill").style.width = `${percentage}%`;
      $("progress-bar").setAttribute("aria-valuenow", percentage);
    }

    function startSession(mode, withNotice = false) {
      currentMode = mode;
      partPlan = {};
      partStats = {};

      let selected = [];

      if (mode === "exam") {
        const history = loadExamHistory();

        validBanks.forEach(bank => {
          const picked = pickExamQuestionsFromBank(bank, EXAM_PER_CHAPTER, history);
          partPlan[bank.id] = picked.length;
          partStats[bank.id] = {
            label: bank.label,
            total: picked.length,
            correct: 0
          };
          selected.push(...picked);
        });

        saveExamHistory(history);
      } else {
        validBanks.forEach(bank => {
          partPlan[bank.id] = bank.questions.length;
          partStats[bank.id] = {
            label: bank.label,
            total: bank.questions.length,
            correct: 0
          };
          selected.push(...bank.questions);
        });
      }

      sessionQuestions = shuffle(selected);
      currentIndex = 0;
      answeredCount = 0;
      correctCount = 0;
      wrongCount = 0;
      answered = false;
      isCompleted = false;

      updateModeUI();

      if (withNotice) {
        if (mode === "exam") {
          showToast(
            `시험 시작! 장별 ${EXAM_PER_CHAPTER}문제씩 총 ${sessionQuestions.length}문제가 중복 없이 출제되었습니다.`
          );
        } else {
          showToast(
            `전체 ${sessionQuestions.length}문제를 중복 없이 새로 섞었습니다.`
          );
        }
      }

      showQuestion();
      resetScrollPositions();
    }

    function showQuestion() {
      const current = sessionQuestions[currentIndex];
      if (!current) {
        showCompletion();
        return;
      }

      answered = false;
      updateScoreboard();
      renderPartChips(current.bankId);

      $("summary-box").hidden = true;
      $("summary-box").replaceChildren();
      $("secondary-action").hidden = true;
      $("feedback").hidden = true;
      $("choices").hidden = false;
      $("choices").replaceChildren();

      $("question-meta").textContent =
        `문제 ${currentIndex + 1} / ${sessionQuestions.length}`;
      $("source-number").textContent =
        `${current.bankLabel} · 문항 ${current.number}`;
      $("question").textContent = current.question;

      $("next").disabled = true;
      $("next").textContent = "정답을 선택하세요";

      current.choices.forEach((text, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";

        const number = document.createElement("span");
        number.className = "choice-number";
        number.textContent = index + 1;

        const label = document.createElement("span");
        label.className = "choice-text";
        label.textContent = text;

        button.append(number, label);
        button.addEventListener("click", () => checkAnswer(index));

        $("choices").appendChild(button);
      });
    }

    function checkAnswer(selected) {
      const current = sessionQuestions[currentIndex];
      if (answered || !current) return;
      answered = true;

      const isCorrect = selected === current.answer;
      answeredCount += 1;

      if (isCorrect) {
        correctCount += 1;
        partStats[current.bankId].correct += 1;
      } else {
        wrongCount += 1;
      }

      [...$("choices").children].forEach((button, index) => {
        button.disabled = true;

        let badgeText = "";
        if (index === current.answer) {
          button.classList.add("correct");
          badgeText = "✓ 정답";
        } else if (index === selected) {
          button.classList.add("wrong");
          badgeText = "✕ 내 선택";
        }

        if (badgeText) {
          const badge = document.createElement("span");
          badge.className = "choice-badge";
          badge.textContent = badgeText;
          button.appendChild(badge);
        }
      });

      $("result").textContent = isCorrect
        ? "🎉 정답입니다! (+1점)"
        : "✕ 오답입니다. 강조된 정답과 해설을 확인하세요. (0점)";

      $("answer-text").textContent =
        `${current.answer + 1}번. ${current.choices[current.answer]}`;
      $("explanation").textContent = current.explanation;
      $("feedback").classList.toggle("is-correct", isCorrect);
      $("feedback").classList.toggle("is-wrong", !isCorrect);
      $("feedback").hidden = false;

      updateScoreboard();

      $("next").disabled = false;
      $("next").textContent =
        currentIndex + 1 < sessionQuestions.length
          ? "다음 문제"
          : "최종 점수 확인";

      requestAnimationFrame(() => {
        $("feedback").scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    }

    function showCompletion() {
      isCompleted = true;
      updateScoreboard();
      renderPartChips(null);

      const total = sessionQuestions.length;
      const accuracy = total ? Math.round((correctCount / total) * 100) : 0;
      const isExam = currentMode === "exam";

      $("question-meta").textContent = isExam ? "시험 채점 완료" : "전체 풀이 완료";
      $("source-number").textContent = `총 ${total}점 만점 (1문제당 1점)`;
      $("question").textContent = isExam
        ? "장별 기말 모의시험 풀이가 끝났습니다."
        : `전체 ${total}문제를 중복 없이 모두 풀었습니다.`;

      $("choices").hidden = true;
      $("choices").replaceChildren();
      $("feedback").hidden = true;

      const summaryBox = $("summary-box");
      summaryBox.replaceChildren();

      const banner = document.createElement("div");
      banner.className = "final-score-banner";

      const label = document.createElement("span");
      label.className = "final-score-label";
      label.textContent = isExam ? "최종 시험 점수" : "최종 점수";

      const number = document.createElement("span");
      number.className = "final-score-number";
      number.textContent = `${correctCount}점 / ${total}점`;

      const rate = document.createElement("span");
      rate.className = "final-score-rate";
      rate.textContent = `정답 ${correctCount}개 · 오답 ${wrongCount}개 (정답률 ${accuracy}%)`;

      banner.append(label, number, rate);

      const list = document.createElement("div");
      list.className = "part-result-list";

      validBanks.forEach(bank => {
        const stat = partStats[bank.id];
        if (!stat || stat.total === 0) return;

        const row = document.createElement("div");
        row.className = "part-result-item";

        const name = document.createElement("span");
        name.className = "part-result-name";
        name.textContent = stat.label;

        const score = document.createElement("span");
        score.className = "part-result-score";
        score.textContent = `${stat.correct}점 / ${stat.total}점`;

        row.append(name, score);
        list.appendChild(row);
      });

      summaryBox.append(banner, list);
      summaryBox.hidden = false;

      $("next").disabled = false;
      $("next").textContent = isExam
        ? `새 시험 다시 풀기 (총 ${examTotalCount}문제)`
        : `전체 ${totalPoolCount}문제 다시 섞어서 풀기`;

      const secondaryBtn = $("secondary-action");
      secondaryBtn.textContent = isExam
        ? `📚 전체 ${totalPoolCount}문제 모드로 돌아가기`
        : `📝 시험시작 (장별 ${EXAM_PER_CHAPTER}문제 · 총 ${examTotalCount}문제)`;
      secondaryBtn.hidden = false;

      resetScrollPositions();
    }

    function confirmInterruptIfNeeded(message) {
      if (answeredCount > 0 && !isCompleted) {
        return window.confirm(message);
      }
      return true;
    }

    $("shuffle-btn").addEventListener("click", () => {
      if (!totalPoolCount) return;

      const msg =
        currentMode === "exam"
          ? `현재 진행 중인 시험을 초기화하고 장별 ${EXAM_PER_CHAPTER}문제를 새로 뽑을까요?`
          : "현재 진행 중인 풀이를 초기화하고 전체 문제를 다시 섞을까요?";

      if (!confirmInterruptIfNeeded(msg)) return;
      startSession(currentMode, true);
    });

    $("exam-btn").addEventListener("click", () => {
      if (!totalPoolCount) return;

      if (currentMode === "all") {
        const msg =
          `진행 중인 전체 문제 풀이를 종료하고 장별 ${EXAM_PER_CHAPTER}문제(총 ${examTotalCount}문제) 시험을 시작할까요?`;
        if (!confirmInterruptIfNeeded(msg)) return;
        startSession("exam", true);
      } else {
        const msg =
          "진행 중인 시험을 종료하고 전체 문제 모드로 돌아갈까요?";
        if (!confirmInterruptIfNeeded(msg)) return;
        startSession("all", true);
      }
    });

    $("secondary-action").addEventListener("click", () => {
      if (!totalPoolCount) return;
      startSession(currentMode === "exam" ? "all" : "exam", true);
    });

    $("next").addEventListener("click", () => {
      if (isCompleted) {
        startSession(currentMode, true);
        return;
      }

      if (currentIndex + 1 < sessionQuestions.length) {
        currentIndex += 1;
        showQuestion();
        resetScrollPositions();
      } else {
        showCompletion();
      }
    });

    window.addEventListener("keydown", e => {
      if (isCompleted) return;
      if (!answered && ["1", "2", "3", "4", "5"].includes(e.key)) {
        const idx = Number(e.key) - 1;
        const buttons = $("choices").children;
        if (buttons[idx]) checkAnswer(idx);
      } else if (answered && e.key === "Enter" && !$("next").disabled) {
        e.preventDefault();
        $("next").click();
      }
    });

    initTheme();

    if (totalPoolCount > 0) {
      startSession("all", false);
    } else {
      $("progress-text").textContent = "문제 파일 연결 필요";
      $("question").textContent =
        "문제를 불러오지 못했습니다.\n" +
        "q1.js, q2.js, q3.js 파일이 index.html과 같은 폴더에 있는지 확인하세요.";
      $("shuffle-btn").hidden = true;
      $("exam-btn").hidden = true;
      $("next").hidden = true;
    }
  </script>
</body>
</html>
